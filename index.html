<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1440, initial-scale=0.32, minimum-scale=0.18, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
  <title>Northstar CRM</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="mark">N</div>
      <button class="nav-btn active" data-view="leads" title="Pipeline">&#8801;</button>
      <button class="nav-btn" data-view="messages" title="Messages">&#9993;</button>
      <button class="nav-btn" data-view="files" title="Files">&#9635;</button>
      <div class="spacer"></div>
      <button class="nav-btn" data-view="settings" title="Settings">&#9881;</button>
    </aside>
    <div class="shell">
      <header class="topbar">
        <div><span class="kicker" style="color:var(--navy)">Northstar CRM</span> <span class="muted">Sales operations workspace</span></div>
        <span class="muted">IndexedDB workspace</span>
      </header>
      <div id="workspace" class="workspace cols-3">
        <section id="list-pane" class="pane"></section>
        <section id="main-pane" class="pane ivory"></section>
        <section id="side-pane" class="pane comms-col"></section>
      </div>
    </div>
  </div>
  <div id="modal" class="modal">
    <div class="sheet">
      <div class="kicker">Source file</div>
      <h3 id="doc-title"></h3>
      <p id="doc-body"></p>
      <button class="btn" id="doc-close">Close</button>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
